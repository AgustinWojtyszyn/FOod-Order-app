services:
  - type: web
    name: food-order-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-store, max-age=0
      - path: /manifest.json
        name: Cache-Control
        value: no-store, max-age=0
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-store, max-age=0
      - path: /service-worker.js
        name: Cache-Control
        value: no-store, max-age=0
      - path: /sw.js
        name: Cache-Control
        value: no-store, max-age=0
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=86400
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=86400
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NPM_CONFIG_PRODUCTION
        value: false
